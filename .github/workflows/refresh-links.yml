name: Refresh links

# Every Monday: pull FMHY's current starred picks, re-check which links respond,
# and commit the result so the site redeploys with fresh data.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-links
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync FMHY starred picks
        run: npm run sync-fmhy

      - name: Check link health
        run: npm run check-health

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/fmhy-links.ts src/lib/fmhy-new.json src/lib/link-health.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore(links): weekly FMHY sync and health check"
            git push
          fi
